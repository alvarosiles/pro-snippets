<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Labels - Gestión</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl font-semibold text-gray-900">Labels</h1>
            <p class="text-sm text-gray-600 mt-1">Gestiona las etiquetas de tu repositorio</p>
          </div>
          <button onclick="openModal(false)"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
            Nuevo Label
          </button>
        </div>
      </div>

      <!-- Tabla de Labels -->
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Label</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción
              </th>
              <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Issues</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200" id="labelsTable">
            <!-- Labels dinámicos aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para Agregar/Editar Label -->
  <div id="labelModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-lg bg-white">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900" id="modalTitle">Crear nuevo label</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <form onsubmit="handleSubmit(event)" class="space-y-4">
        <div>
          <label for="labelName" class="block text-sm font-medium text-gray-700 mb-1">Nombre del label</label>
          <input type="text" id="labelName" name="labelName"
            placeholder="bug, feature, documentation..."
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
            required>
        </div>

        <div>
          <label for="labelDescription" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
          <textarea id="labelDescription" name="labelDescription" rows="3"
            placeholder="Describe el propósito de este label..."
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div>
          <label for="labelColor" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
          <div class="flex gap-2">
            <input type="color" id="labelColor" name="labelColor" value="#3b82f6"
              class="h-10 w-20 border border-gray-300 rounded cursor-pointer">
            <input type="text" id="labelColorHex" value="#3b82f6" placeholder="#3b82f6"
              class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Vista previa</label>
          <div class="p-4 bg-gray-50 rounded-md">
            <span id="labelPreview"
              class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
              label preview
            </span>
          </div>
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal()"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 font-medium transition-colors">
            Cancelar
          </button>
          <button type="submit"
            class="flex-1 px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-medium transition-colors"
            id="saveButton">Crear label</button>
          <button type="button"
            class="flex-1 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md font-medium transition-colors hidden"
            id="deleteButton" onclick="deleteLabel()">Eliminar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let editingRow = null;

    // Abrir modal
    function openModal(isEdit) {
      document.getElementById('labelModal').classList.remove('hidden');
      document.getElementById('deleteButton').classList.toggle('hidden', !isEdit);
      document.getElementById('saveButton').textContent = isEdit ? 'Guardar cambios' : 'Crear label';
      document.getElementById('modalTitle').textContent = isEdit ? 'Editar label' : 'Crear nuevo label';
      if (!isEdit) {
        // Color aleatorio al crear nuevo
        const randomColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        document.getElementById('labelColor').value = randomColor;
        document.getElementById('labelColorHex').value = randomColor;
        updatePreview();
      }
    }

    // Cerrar modal
    function closeModal() {
      document.getElementById('labelModal').classList.add('hidden');
      document.querySelector('form').reset();
      editingRow = null;
    }

    // Actualizar preview
    function updatePreview() {
      const name = document.getElementById('labelName').value || 'label preview';
      const color = document.getElementById('labelColor').value;
      const preview = document.getElementById('labelPreview');

      // Texto oscuro para fondos claros, texto claro para fondos oscuros
      const r = parseInt(color.substr(1, 2), 16);
      const g = parseInt(color.substr(3, 2), 16);
      const b = parseInt(color.substr(5, 2), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const textColor = luminance > 0.5 ? '#1f2937' : '#ffffff';

      preview.textContent = name;
      preview.style.backgroundColor = color + '33';
      preview.style.color = textColor;
      preview.style.border = '1px solid ' + color;
    }

    document.getElementById('labelColor').addEventListener('input', e => {
      document.getElementById('labelColorHex').value = e.target.value;
      updatePreview();
    });

    document.getElementById('labelColorHex').addEventListener('input', e => {
      const color = e.target.value;
      if (/^#[0-9A-F]{6}$/i.test(color)) {
        document.getElementById('labelColor').value = color;
        updatePreview();
      }
    });

    document.getElementById('labelName').addEventListener('input', updatePreview);

    // Crear o editar
    function handleSubmit(event) {
      event.preventDefault();
      const name = document.getElementById('labelName').value;
      const desc = document.getElementById('labelDescription').value;
      const color = document.getElementById('labelColor').value;

      if (editingRow) {
        // Editar
        const span = editingRow.querySelector('span');
        span.textContent = name;
        span.style.backgroundColor = color + '33';
        span.style.color = color;
        span.style.border = '1px solid ' + color;
        span.dataset.color = color;
        editingRow.children[1].textContent = desc;
      } else {
        // Crear nuevo
        const tbody = document.getElementById('labelsTable');
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50';
        tr.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
              style="background-color:${color}33;color:${color};border:1px solid ${color};"
              data-color="${color}">${name}</span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-600">${desc}</td>
          <td class="px-6 py-4 text-center text-sm text-gray-900">0</td>
          <td class="px-6 py-4 text-right text-sm font-medium">
            <button class="text-blue-600 hover:text-blue-800 mr-4" onclick="editLabel(this)">Editar</button>
            <button class="text-red-600 hover:text-red-800" onclick="removeRow(this)">Eliminar</button>
          </td>`;
        tbody.appendChild(tr);
      }

      closeModal();
    }

    function editLabel(btn) {
      editingRow = btn.closest('tr');
      const span = editingRow.querySelector('span');
      const name = span.textContent.trim();
      const desc = editingRow.children[1].textContent.trim();
      const color = span.dataset.color;

      document.getElementById('labelName').value = name;
      document.getElementById('labelDescription').value = desc;
      document.getElementById('labelColor').value = color;
      document.getElementById('labelColorHex').value = color;
      updatePreview();
      openModal(true);
    }

    function deleteLabel() {
      if (editingRow) {
        editingRow.remove();
        closeModal();
      }
    }

    function removeRow(btn) {
      btn.closest('tr').remove();
    }

    // Cerrar modal al hacer clic fuera
    document.getElementById('labelModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>

</html>

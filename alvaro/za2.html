<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue #42 - Agregar autenticación de usuarios</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header class="bg-gray-900 text-white py-3 px-4">
    <div class="max-w-7xl mx-auto flex items-center gap-4">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 16 16">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span class="text-xl font-semibold">mi-proyecto / backend-api</span>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex gap-6">
      <!-- Main Content -->
      <main class="flex-1">
        <div class="bg-white rounded-lg border border-gray-300 mb-4">
          <div class="p-6">
            <div class="flex items-start gap-3 mb-4">
              <h1 class="text-3xl font-semibold flex-1">
                Agregar autenticación de usuarios
                <span class="text-gray-500 font-normal text-2xl">#42</span>
              </h1>
              <button class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium">
                Editar
              </button>
            </div>

            <!-- Selected Labels Display -->
            <div id="selectedLabelsDisplay" class="flex flex-wrap gap-2 mb-4">
              <!-- Labels seleccionados aparecerán aquí -->
            </div>
          </div>
        </div>
      </main>

      <!-- Sidebar -->
      <aside class="w-80">
        <!-- Labels Section -->
        <div class="bg-white rounded-lg border border-gray-300 mb-4">
          <div class="p-4 border-b border-gray-200 flex items-center justify-between">
            <h3 class="font-semibold text-gray-900">Labels</h3>
            <button class="text-gray-500 hover:text-gray-700">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </button>
          </div>

          <div class="p-3">
            <input 
              type="text" 
              id="labelSearch"
              placeholder="Filtrar labels..." 
              class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3"
            >

            <div id="labelsList" class="space-y-1 max-h-96 overflow-y-auto">
              <!-- Labels predefinidos -->
              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="bug" data-color="#dc2626" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-red-600 text-white">bug</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">12 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="feature" data-color="#2563eb" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-600 text-white">feature</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">8 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="documentation" data-color="#9333ea" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-purple-600 text-white">documentation</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">3 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="high priority" data-color="#ea580c" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-orange-600 text-white">high priority</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">5 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="enhancement" data-color="#0d9488" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-teal-600 text-white">enhancement</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">15 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="good first issue" data-color="#16a34a" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-600 text-white">good first issue</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">7 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="help wanted" data-color="#ca8a04" data-text="text-gray-900">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-yellow-600 text-gray-900">help wanted</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">4 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="wontfix" data-color="#4b5563" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-600 text-white">wontfix</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">2 abiertos</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="duplicate" data-color="#9ca3af" data-text="text-gray-900">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-400 text-gray-900">duplicate</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">1 abierto</span>
              </label>

              <label class="flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group">
                <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" data-label="security" data-color="#ec4899" data-text="text-white">
                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-pink-600 text-white">security</span>
                <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">3 abiertos</span>
              </label>

              <!-- No results -->
              <div id="noResultsMessage" class="hidden p-2">
                <button class="flex items-center gap-2 text-sm text-gray-700 hover:bg-gray-50 rounded p-2 w-full">
                  <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                  </svg>
                  <span>Crear "<span id="searchTermDisplay" class="font-medium"></span>"</span>
                </button>
              </div>

              <!-- Edit labels link -->
              <div class="pt-2 border-t border-gray-200 mt-2">
                <a href="#" class="flex items-center gap-2 p-2 text-sm text-gray-700 hover:bg-gray-50 rounded">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                  <span class="font-medium">Editar labels</span>
                </a>
              </div>
            </div>

            <div class="mt-3 pt-3 border-t border-gray-200">
              <button class="text-sm text-blue-600 hover:text-blue-800 font-medium" onclick="openCreateLabelModal()">
                + Crear nuevo label
              </button>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Modal -->
  <div id="createLabelModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
      <div class="p-6 border-b border-gray-200">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-semibold text-gray-900">Crear nuevo label</h2>
          <button onclick="closeCreateLabelModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="p-6">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Nombre del label</label>
          <input type="text" id="newLabelName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: bug, feature">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Descripción (opcional)</label>
          <textarea id="newLabelDescription" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Descripción..."></textarea>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Color</label>
          <div class="flex gap-2 mb-3">
            <input type="color" id="newLabelColor" value="#3b82f6" class="w-16 h-10 rounded border border-gray-300 cursor-pointer">
            <input type="text" id="newLabelColorHex" value="#3b82f6" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm" placeholder="#3b82f6">
          </div>
          <div class="flex flex-wrap gap-2">
            <button onclick="setLabelColor('#ef4444')" class="w-8 h-8 rounded bg-red-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#f97316')" class="w-8 h-8 rounded bg-orange-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#eab308')" class="w-8 h-8 rounded bg-yellow-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#22c55e')" class="w-8 h-8 rounded bg-green-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#14b8a6')" class="w-8 h-8 rounded bg-teal-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#3b82f6')" class="w-8 h-8 rounded bg-blue-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#8b5cf6')" class="w-8 h-8 rounded bg-purple-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#ec4899')" class="w-8 h-8 rounded bg-pink-600 hover:ring-2 ring-gray-400"></button>
            <button onclick="setLabelColor('#6b7280')" class="w-8 h-8 rounded bg-gray-600 hover:ring-2 ring-gray-400"></button>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Vista previa</label>
          <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
            <span id="labelPreview" class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-600 text-white">Label preview</span>
          </div>
        </div>

        <div class="flex gap-3">
          <button onclick="closeCreateLabelModal()" class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 font-medium">Cancelar</button>
          <button onclick="saveNewLabel()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium">Crear label</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const selectedLabelsDisplay = document.getElementById('selectedLabelsDisplay');
    const labelSearch = document.getElementById('labelSearch');
    const noResultsMessage = document.getElementById('noResultsMessage');
    const searchTermDisplay = document.getElementById('searchTermDisplay');

    function updateSelectedLabels() {
      selectedLabelsDisplay.innerHTML = '';
      const checkboxes = document.querySelectorAll('.label-checkbox');

      checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
          const labelName = checkbox.dataset.label;
          const labelColor = checkbox.dataset.color;
          const labelText = checkbox.dataset.text;

          const span = document.createElement('span');
          span.className = `inline-flex items-center gap-1 px-3 py-1 rounded-full text-sm font-medium ${labelText}`;
          span.style.backgroundColor = labelColor;
          span.innerHTML = `
            ${labelName}
            <button class="hover:bg-black/20 rounded-full p-0.5 transition-colors" onclick="removeLabel('${labelName}')">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
              </svg>
            </button>
          `;
          selectedLabelsDisplay.appendChild(span);
        }
      });

      if (selectedLabelsDisplay.children.length === 0) {
        selectedLabelsDisplay.innerHTML = '<span class="text-sm text-gray-500">Ningún label aplicado aún</span>';
      }
    }

    window.removeLabel = function(name) {
      const checkbox = document.querySelector(`.label-checkbox[data-label="${name}"]`);
      if (checkbox) checkbox.checked = false;
      updateSelectedLabels();
    };

    // Búsqueda
    labelSearch.addEventListener('input', () => {
      const term = labelSearch.value.toLowerCase().trim();
      const labels = document.querySelectorAll('#labelsList > label');
      let visible = 0;

      labels.forEach(label => {
        const name = label.querySelector('.label-checkbox').dataset.label.toLowerCase();
        if (name.includes(term)) {
          label.style.display = 'flex';
          visible++;
        } else {
          label.style.display = 'none';
        }
      });

      if (visible === 0 && term) {
        noResultsMessage.classList.remove('hidden');
        searchTermDisplay.textContent = term;
      } else {
        noResultsMessage.classList.add('hidden');
      }
    });

    noResultsMessage.querySelector('button').addEventListener('click', () => {
      openCreateLabelModal(labelSearch.value.trim());
    });

    // Modal
    window.openCreateLabelModal = function(name = '') {
      document.getElementById('newLabelName').value = name;
      document.getElementById('createLabelModal').classList.remove('hidden');
      updateLabelPreview();
      document.getElementById('newLabelName').focus();
    };

    window.closeCreateLabelModal = function() {
      document.getElementById('createLabelModal').classList.add('hidden');
      document.getElementById('newLabelName').value = '';
      document.getElementById('newLabelDescription').value = '';
      document.getElementById('newLabelColor').value = '#3b82f6';
      document.getElementById('newLabelColorHex').value = '#3b82f6';
    };

    window.setLabelColor = function(color) {
      document.getElementById('newLabelColor').value = color;
      document.getElementById('newLabelColorHex').value = color;
      updateLabelPreview();
    };

    document.getElementById('newLabelColor').addEventListener('input', e => {
      document.getElementById('newLabelColorHex').value = e.target.value;
      updateLabelPreview();
    });

    document.getElementById('newLabelColorHex').addEventListener('input', e => {
      const val = e.target.value;
      if (/^#[0-9A-F]{6}$/i.test(val)) {
        document.getElementById('newLabelColor').value = val;
        updateLabelPreview();
      }
    });

    document.getElementById('newLabelName').addEventListener('input', updateLabelPreview);

    function updateLabelPreview() {
      const name = document.getElementById('newLabelName').value || 'Label preview';
      const color = document.getElementById('newLabelColor').value;
      const preview = document.getElementById('labelPreview');
      const textColor = getContrastColor(color);
      preview.textContent = name;
      preview.style.backgroundColor = color;
      preview.style.color = textColor;
    }

    function getContrastColor(hex) {
      const r = parseInt(hex.substr(1, 2), 16);
      const g = parseInt(hex.substr(3, 2), 16);
      const b = parseInt(hex.substr(5, 2), 16);
      const l = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return l > 0.5 ? '#000000' : '#ffffff';
    }
 window.saveNewLabel = function() {
  const name = document.getElementById('newLabelName').value.trim();
  const color = document.getElementById('newLabelColor').value;

  if (!name) return alert('Ingresa un nombre para el label');

  if (document.querySelector(`.label-checkbox[data-label="${name.toLowerCase()}"]`)) {
    return alert('Ya existe un label con ese nombre');
  }

  const textColor = getContrastColor(color);
  const textClass = textColor === '#ffffff' ? 'text-white' : 'text-gray-900';

  const labelsList = document.getElementById('labelsList');

  // CORRECTO: Insertar antes del <div class="pt-2 border-t ..."> que contiene "Editar labels"
  const editLabelsContainer = labelsList.querySelector('.pt-2.border-t');

  const newLabel = document.createElement('label');
  newLabel.className = 'flex items-center gap-2 p-2 hover:bg-gray-50 rounded cursor-pointer group';
  newLabel.innerHTML = `
    <input type="checkbox" class="label-checkbox w-4 h-4 rounded border-gray-300" 
           data-label="${name}" data-color="${color}" data-text="${textClass}" checked>
    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${textClass}" 
          style="background-color: ${color}">${name}</span>
    <span class="text-xs text-gray-500 ml-auto opacity-0 group-hover:opacity-100">0 abiertos</span>
  `;

  // Insertar antes del "Editar labels"
  labelsList.insertBefore(newLabel, editLabelsContainer);

  // Agregar evento al nuevo checkbox
  const checkbox = newLabel.querySelector('.label-checkbox');
  checkbox.addEventListener('change', updateSelectedLabels);

  // Actualizar vista
  updateSelectedLabels();

  // Cerrar y limpiar
  closeCreateLabelModal();
  labelSearch.value = '';
  noResultsMessage.classList.add('hidden');
  document.querySelectorAll('#labelsList label').forEach(l => l.style.display = 'flex');
};
    // Cerrar modal al hacer clic fuera
    document.getElementById('createLabelModal').addEventListener('click', e => {
      if (e.target.id === 'createLabelModal') closeCreateLabelModal();
    });

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.label-checkbox').forEach(cb => {
        if (['bug', 'high priority'].includes(cb.dataset.label)) cb.checked = true;
        cb.addEventListener('change', updateSelectedLabels);
      });
      updateSelectedLabels();
    });
  </script>
</body>
</html>

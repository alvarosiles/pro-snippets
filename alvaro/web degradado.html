<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente Azul - Sistema POS</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .gradient-card {
            background: linear-gradient(135deg, #4285f4 0%, #1a73e8 50%, #1557b0 100%);
            padding: 24px 32px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 8px 32px rgba(26, 115, 232, 0.3);
            max-width: 320px;
            width: 100%;
        }

        .icon {
            width: 24px;
            height: 24px;
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 14px;
            margin: 0;
            opacity: 0.9;
            line-height: 1.4;
        }

        /* Gradient variations */
        .gradient-examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
            width: 100%;
            max-width: 900px;
        }

        .gradient-1 {
            background: linear-gradient(135deg, #4285f4 0%, #1a73e8 100%);
        }

        .gradient-2 {
            background: linear-gradient(45deg, #2196f3 0%, #1976d2 100%);
        }

        .gradient-3 {
            background: linear-gradient(180deg, #42a5f5 0%, #1565c0 100%);
        }
    </style>
</head>
<body>
    <div>
        <div class="gradient-card">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12L8.1 13h7.45c.75 0 1.41-.41 1.75-1.03L21.7 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
            <h2 class="title">Sistema POS</h2>
            <p class="subtitle">Gestiona tus ventas de forma eficiente</p>
        </div>

        <div class="gradient-examples">
            <div class="gradient-card gradient-1">
                <h3 class="title">Variación 1</h3>
                <p class="subtitle">Gradiente azul clásico</p>
            </div>
            <div class="gradient-card gradient-2">
                <h3 class="title">Variación 2</h3>
                <p class="subtitle">Gradiente azul material</p>
            </div>
            <div class="gradient-card gradient-3">
                <h3 class="title">Variación 3</h3>
                <p class="subtitle">Gradiente azul vertical</p>
            </div>
        </div>
    </div>
</body>
</html>

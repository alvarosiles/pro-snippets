        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            background: #f8f9fa;
            border-bottom: 3px solid #e9ecef;
        }

        .summary-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .summary-card h3 {
            font-size: 0.9rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-card p {
            font-size: 2rem;
            font-weight: 700;
            color: #1e3c72;
        }

        .content {
            padding: 2rem;
        }

        .session {
            margin-bottom: 3rem;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .session:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .session-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .session-header.open {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .session-info {
            display: flex;
            flex-direction: column;
        }

        .session-info label {
            font-size: 0.75rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .session-info span {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.cerrada {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .status-badge.abierta {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            color: #212529;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .icon {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon::before {
            content: '';
            width: 24px;
            height: 24px;
            display: inline-block;
            background-size: contain;
            background-repeat: no-repeat;
        }

        .icon.Money::before {
            content: '💵';
        }

        .icon.Card::before {
            content: '💳';
        }

        .icon.Cheque::before {
            content: '📋';
        }

        .amount-positive {
            color: #28a745;
            font-weight: 600;
        }

        .amount-negative {
            color: #dc3545;
            font-weight: 600;
        }

        .amount-zero {
            color: #6c757d;
            font-weight: 600;
        }

        .no-data {
            padding: 2rem;
            text-align: center;
            color: #6c757d;
            font-style: italic;
            background: #f8f9fa;
        }

        .footer {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            color: #6c757d;
            border-top: 3px solid #e9ecef;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .session:hover {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatAmount(amount) {
            if (amount === null || amount === undefined) return 'N/A';
            return new Intl.NumberFormat('es-ES', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function getAmountClass(amount) {
            if (amount > 0) return 'amount-positive';
            if (amount < 0) return 'amount-negative';
            return 'amount-zero';
        }

        function calculateSummary() {
            const sessions = Object.values(data);
            const totalSessions = sessions.length;
            const openSessions = sessions.filter(s => s.estado === 'abierta').length;
            const closedSessions = sessions.filter(s => s.estado === 'cerrada').length;
            
            let totalAmount = 0;
            sessions.forEach(session => {
                if (session.detalle_tipo_pago) {
                    session.detalle_tipo_pago.forEach(pago => {
                        totalAmount += pago.monto_total;
                    });
                }
            });

            return { totalSessions, openSessions, closedSessions, totalAmount };
        }

                    <p>${summary.totalSessions}</p>
                </div>
                <div class="summary-card">
                    <h3>Sesiones Cerradas</h3>
                    <p>${summary.closedSessions}</p>
                </div>
                <div class="summary-card">
                    <h3>Sesiones Abiertas</h3>
                    <p>${summary.openSessions}</p>
                </div>
                <div class="summary-card">
                    <h3>Monto Total</h3>
                    <p class="${getAmountClass(summary.totalAmount)}">${formatAmount(summary.totalAmount)}</p>
                </div>
            `;
        }

        function renderSessions() {
            const contentDiv = document.getElementById('content');
            const sessions = Object.values(data).sort((a, b) => 
                new Date(b.fecha) - new Date(a.fecha)
            );

            sessions.forEach(session => {
                const sessionDiv = document.createElement('div');
                sessionDiv.className = 'session';

                const headerClass = session.estado === 'abierta' ? 'session-header open' : 'session-header';
                
                let tableContent = '';
                if (session.detalle_tipo_pago && session.detalle_tipo_pago.length > 0) {
                    tableContent = `
                        <table>
                            <thead>
                                <tr>
                                    <th>Tipo de Pago</th>
                                    <th>Descripción</th>
                                    <th style="text-align: right;">Monto Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${session.detalle_tipo_pago.map(pago => `
                                    <tr>
                                        <td>
                                            <span class="icon ${pago.icon}">${pago.tipo_pago}</span>
                                        </td>
                                        <td>${pago.descripcion}</td>
                                        <td style="text-align: right;" class="${getAmountClass(pago.monto_total)}">
                                            ${formatAmount(pago.monto_total)}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    tableContent = '<div class="no-data">Sin datos de pagos registrados</div>';
                }

                sessionDiv.innerHTML = `
                    <div class="${headerClass}">
                        <div class="session-info">
                            <label>Fecha</label>
                            <span>${formatDate(session.fecha)}</span>
                        </div>
                        <div class="session-info">
                            <label>Estado</label>
                            <span class="status-badge ${session.estado}">${session.estado.toUpperCase()}</span>
                        </div>
                        <div class="session-info">
                            <label>Fecha Apertura</label>
                            <span>${formatDate(session.fecha_on)}</span>
                        </div>
                        <div class="session-info">
                            <label>Fecha Cierre</label>
                            <span>${formatDate(session.fecha_cierre)}</span>
                        </div>
                        <div class="session-info">
                            <label>Monto Cierre</label>
                            <span class="${getAmountClass(session.monto_cierre)}">${formatAmount(session.monto_cierre)}</span>
                        </div>
                    </div>
                    ${tableContent}
                `;

                contentDiv.appendChild(sessionDiv);
            });
        }

        // Initialize
        renderSummary();
        renderSessions();
    </script>
</body>
</html>

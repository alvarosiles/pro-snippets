<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Vouchers - Interfaz Mejorada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px;
      text-align: center;
      position: relative;
    }

    .modal-header h2 {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-header p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
    }

    .modal-body {
      padding: 32px;
    }

    .upload-methods {
      margin-bottom: 32px;
    }

    .upload-methods h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-methods h3::before {
      content: "📤";
      font-size: 20px;
    }

    .upload-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .upload-btn {
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .upload-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }

    .upload-btn:hover {
      border-color: #667eea;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    .upload-btn:hover::before {
      opacity: 0.1;
    }

    .upload-btn-icon {
      font-size: 32px;
      position: relative;
      z-index: 1;
    }

    .upload-btn-text {
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      text-align: center;
      position: relative;
      z-index: 1;
      transition: color 0.3s ease;
    }

    .upload-btn:hover .upload-btn-text {
      color: #667eea;
    }

    .drop-zone {
      border: 3px dashed #cbd5e0;
      border-radius: 20px;
      padding: 48px 24px;
      text-align: center;
      background: #f7fafc;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: #667eea;
      background: #eef2ff;
      transform: scale(1.02);
    }

    .drop-zone-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .drop-zone h4 {
      font-size: 18px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .drop-zone p {
      font-size: 14px;
      color: #718096;
      margin-bottom: 16px;
    }

    .drop-zone-browse {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .drop-zone-browse:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .file-input {
      display: none;
    }

    .preview-area {
      margin-top: 24px;
      display: none;
    }

    .preview-area.active {
      display: block;
    }

    .preview-title {
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(239, 68, 68, 0.95);
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .preview-remove:hover {
      background: #dc2626;
      transform: scale(1.1);
    }

    .modal-footer {
      padding: 24px 32px;
      background: #f7fafc;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-cancel {
      background: white;
      color: #4a5568;
      border: 2px solid #e2e8f0;
    }

    .btn-cancel:hover {
      background: #f7fafc;
      border-color: #cbd5e0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .success-message {
      display: none;
      background: #d1fae5;
      border: 2px solid #6ee7b7;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      color: #065f46;
      font-weight: 600;
      text-align: center;
    }

    .success-message.active {
      display: block;
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      .modal-header {
        padding: 24px;
      }

      .modal-header h2 {
        font-size: 24px;
      }

      .modal-body {
        padding: 24px;
      }

      .upload-buttons {
        grid-template-columns: 1fr;
      }

      .modal-footer {
        flex-direction: column-reverse;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <h2>✨ Subir Vouchers</h2>
      <p>Arrastra tus archivos o selecciona un método de carga</p>
    </div>

    <div class="modal-body">
      <div class="success-message" id="successMessage">
        ✅ ¡Archivos cargados exitosamente!
      </div>

      <div class="upload-methods">
        <h3>Métodos de carga</h3>
        <div class="upload-buttons">
          <button class="upload-btn" onclick="uploadFromDrive()">
            <div class="upload-btn-icon">📁</div>
            <div class="upload-btn-text">Google Drive</div>
          </button>
          <button class="upload-btn" onclick="uploadFromCloud()">
            <div class="upload-btn-icon">☁️</div>
            <div class="upload-btn-text">Nube</div>
          </button>
          <button class="upload-btn" onclick="uploadFromDevice()">
            <div class="upload-btn-icon">💾</div>
            <div class="upload-btn-text">Mi Dispositivo</div>
          </button>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📎</div>
        <h4>Arrastra tus archivos aquí</h4>
        <p>o haz clic para seleccionar</p>
        <button class="drop-zone-browse" onclick="document.getElementById('fileInput').click()">
          Explorar archivos
        </button>
        <input type="file" id="fileInput" class="file-input" multiple accept="image/*,.pdf" onchange="handleFiles(this.files)">
      </div>

      <div class="preview-area" id="previewArea">
        <div class="preview-title">📋 Archivos seleccionados</div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="cancelUpload()">
        ❌ Cancelar
      </button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveFiles()" disabled>
        💾 Guardar cambios
      </button>
    </div>
  </div>

  <script>
    let selectedFiles = [];

    const dropZone = document.getElementById('dropZone');
    const previewArea = document.getElementById('previewArea');
    const previewGrid = document.getElementById('previewGrid');
    const saveBtn = document.getElementById('saveBtn');
    const successMessage = document.getElementById('successMessage');

    // Drag and drop handlers
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });

    dropZone.addEventListener('click', (e) => {
      if (e.target === dropZone || e.target.closest('.drop-zone-icon') || e.target.closest('h4') || e.target.closest('p')) {
        document.getElementById('fileInput').click();
      }
    });

    function handleFiles(files) {
      selectedFiles = Array.from(files);
      updatePreview();
      saveBtn.disabled = selectedFiles.length === 0;
    }

    function updatePreview() {
      previewGrid.innerHTML = '';
      
      if (selectedFiles.length > 0) {
        previewArea.classList.add('active');
        
        selectedFiles.forEach((file, index) => {
          const reader = new FileReader();
          
          reader.onload = (e) => {
            const previewItem = document.createElement('div');
            previewItem.className = 'preview-item';
            
            if (file.type.startsWith('image/')) {
              previewItem.innerHTML = `
                <img src="${e.target.result}" alt="${file.name}">
                <button class="preview-remove" onclick="removeFile(${index})">×</button>
              `;
            } else {
              previewItem.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: center; height: 100%; font-size: 32px;">📄</div>
                <button class="preview-remove" onclick="removeFile(${index})">×</button>
              `;
            }
            
            previewGrid.appendChild(previewItem);
          };
          
          reader.readAsDataURL(file);
        });
      } else {
        previewArea.classList.remove('active');
      }
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      updatePreview();
      saveBtn.disabled = selectedFiles.length === 0;
    }

    function uploadFromDrive() {
      alert('🚀 Conectando con Google Drive...\n(Funcionalidad de demostración)');
    }

    function uploadFromCloud() {
      alert('☁️ Conectando con servicios en la nube...\n(Funcionalidad de demostración)');
    }

    function uploadFromDevice() {
      document.getElementById('fileInput').click();
    }

    function saveFiles() {
      if (selectedFiles.length === 0) return;
      
      saveBtn.disabled = true;
      saveBtn.innerHTML = '⏳ Guardando...';
      
      // Simulate upload
      setTimeout(() => {
        successMessage.classList.add('active');
        saveBtn.innerHTML = '✅ Guardado';
        
        setTimeout(() => {
          successMessage.classList.remove('active');
          selectedFiles = [];
          updatePreview();
          saveBtn.innerHTML = '💾 Guardar cambios';
          saveBtn.disabled = true;
          document.getElementById('fileInput').value = '';
        }, 2000);
      }, 1500);
    }

    function cancelUpload() {
      if (selectedFiles.length > 0) {
        if (confirm('¿Estás seguro de que quieres cancelar? Se perderán los archivos seleccionados.')) {
          selectedFiles = [];
          updatePreview();
          saveBtn.disabled = true;
          document.getElementById('fileInput').value = '';
        }
      } else {
        alert('Modal cerrado');
      }
    }
  </script>
</body>
</html>

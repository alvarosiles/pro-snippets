            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            background: #f8f9fa;
            border-bottom: 3px solid #e9ecef;
        }

        .summary-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .summary-card h3 {
            font-size: 0.9rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .summary-card p {
            font-size: 2rem;
            font-weight: 700;
            color: #1e3c72;
        }

        .content {
            padding: 2rem;
            overflow-x: auto;
        }

        .main-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        .main-table thead {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .main-table th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border: none;
        }

        .main-table th:last-child {
            text-align: right;
        }

        .main-table td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
            color: #212529;
            vertical-align: top;
        }

        .main-table td:last-child {
            text-align: right;
        }

        .main-table tbody tr:hover {
            background: #f8f9fa;
        }

        .session-group {
            border-left: 4px solid #667eea;
        }

        .session-group.open {
            border-left-color: #38ef7d;
            background: rgba(56, 239, 125, 0.05);
        }

        .session-group.closed {
            border-left-color: #764ba2;
        }

        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #6c757d;
            word-break: break-all;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.cerrada {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .status-badge.abierta {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .icon {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon::before {
            content: '';
            width: 24px;
            height: 24px;
            display: inline-block;
            background-size: contain;
            background-repeat: no-repeat;
        }

        .icon.Money::before {
            content: '💵';
        }

        .icon.Card::before {
            content: '💳';
        }

        .icon.Cheque::before {
            content: '📋';
        }

        .amount-positive {
            color: #28a745;
            font-weight: 600;
        }

        .amount-negative {
            color: #dc3545;
            font-weight: 600;
        }

        .amount-zero {
            color: #6c757d;
            font-weight: 600;
        }

        .no-data-row {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            background: #f8f9fa;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .main-table tbody tr:hover {
                background: none;
            }
        }
    </style>
</head>

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleString('es-ES', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatAmount(amount) {
            if (amount === null || amount === undefined) return 'N/A';
            return new Intl.NumberFormat('es-ES', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        function getAmountClass(amount) {
            if (amount > 0) return 'amount-positive';
            if (amount < 0) return 'amount-negative';
            return 'amount-zero';
        }

        function calculateSummary() {
            const sessions = Object.values(data);
            const totalSessions = sessions.length;
            const openSessions = sessions.filter(s => s.estado === 'abierta').length;
            const closedSessions = sessions.filter(s => s.estado === 'cerrada').length;
            
            let totalAmount = 0;
            sessions.forEach(session => {
                if (session.detalle_tipo_pago) {
                    session.detalle_tipo_pago.forEach(pago => {
                        totalAmount += pago.monto_total;
                    });
                }
            });

            return { totalSessions, openSessions, closedSessions, totalAmount };
        }

                    <h3>Sesiones Cerradas</h3>
                    <p>${summary.closedSessions}</p>
                </div>
                <div class="summary-card">
                    <h3>Sesiones Abiertas</h3>
                    <p>${summary.openSessions}</p>
                </div>
                <div class="summary-card">
                    <h3>Monto Total</h3>
                    <p class="${getAmountClass(summary.totalAmount)}">${formatAmount(summary.totalAmount)}</p>
                </div>
            `;
        }

        function renderSessions() {
            const contentDiv = document.getElementById('content');
            const sessions = Object.values(data).sort((a, b) => 
                new Date(b.fecha) - new Date(a.fecha)
            );

            let tableHTML = `
                <table class="main-table">
                    <thead>
                        <tr>
                            <th>ID Sesión</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Fecha Apertura</th>
                            <th>Fecha Cierre</th>
                            <th>Tipo de Pago</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            sessions.forEach(session => {
                const statusClass = session.estado === 'abierta' ? 'open' : 'closed';
                
                if (session.detalle_tipo_pago && session.detalle_tipo_pago.length > 0) {
                    session.detalle_tipo_pago.forEach((pago, index) => {
                        if (index === 0) {
                            // First row includes session info with rowspan
                            tableHTML += `
                                <tr class="session-group ${statusClass}">
                                    <td rowspan="${session.detalle_tipo_pago.length}" class="session-id">${session.key}</td>
                                    <td rowspan="${session.detalle_tipo_pago.length}">${formatDate(session.fecha)}</td>
                                    <td rowspan="${session.detalle_tipo_pago.length}">
                                        <span class="status-badge ${session.estado}">${session.estado.toUpperCase()}</span>
                                    </td>
                                    <td rowspan="${session.detalle_tipo_pago.length}">${formatDate(session.fecha_on)}</td>
                                    <td rowspan="${session.detalle_tipo_pago.length}">${formatDate(session.fecha_cierre)}</td>
                                    <td><span class="icon ${pago.icon}">${pago.tipo_pago}</span></td>
                                    <td>${pago.descripcion}</td>
                                    <td class="${getAmountClass(pago.monto_total)}">${formatAmount(pago.monto_total)}</td>
                                </tr>
                            `;
                        } else {
                            // Subsequent rows only show payment details
                            tableHTML += `
                                <tr class="session-group ${statusClass}">
                                    <td><span class="icon ${pago.icon}">${pago.tipo_pago}</span></td>
                                    <td>${pago.descripcion}</td>
                                    <td class="${getAmountClass(pago.monto_total)}">${formatAmount(pago.monto_total)}</td>
                                </tr>
                            `;
                        }
                    });
                } else {
                    // Session with no payment details
                    tableHTML += `
                        <tr class="session-group ${statusClass}">
                            <td class="session-id">${session.key}</td>
                            <td>${formatDate(session.fecha)}</td>
                            <td>
                                <span class="status-badge ${session.estado}">${session.estado.toUpperCase()}</span>
                            </td>
                            <td>${formatDate(session.fecha_on)}</td>
                            <td>${formatDate(session.fecha_cierre)}</td>
                            <td colspan="3" class="no-data-row">Sin datos de pagos registrados</td>
                        </tr>
                    `;
                }
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            contentDiv.innerHTML = tableHTML;
        }

        // Initialize
        renderSummary();
        renderSessions();
    </script>
</body>
</html>

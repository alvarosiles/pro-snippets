<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI estilo Framer</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CARD estilo Framer */
.card{
    width:320px;
    padding:20px;

    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);

    border:1px solid rgba(255,255,255,0.1);
    border-radius:16px;

    box-shadow:0 20px 40px rgba(0,0,0,0.4);

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border:1px solid rgba(255,255,255,0.2);
}

.title{
    color:white;
    font-size:20px;
    font-weight:bold;
}

.text{
    color:#cbd5e1;
    margin-top:10px;
    font-size:14px;
}

.button{
    margin-top:15px;
    padding:10px;
    width:100%;

    border:none;
    border-radius:10px;

    background:#6366f1;
    color:white;

    cursor:pointer;
    font-weight:bold;

    transition:.2s;
}

.button:hover{
    background:#4f46e5;
}

</style>
</head>

<body>

<div class="card">
    <div class="title">Estilo Framer</div>
    <div class="text">
        Este es un diseño tipo SaaS moderno con efecto glass y hover suave.
    </div>
    <button class="button">Empezar</button>
</div>

</body>
</html>

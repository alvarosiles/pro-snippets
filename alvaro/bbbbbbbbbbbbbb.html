<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito de Compras</title>

<style>

:root{
    --principal:#a740e7;
    --principal-hover:#9333d6;
    --principal-light:#d8b4fe;

    --fondo:#1f2937;
    --fondo-card:#334155;
    --footer:#111827;

    --texto:#ffffff;
    --texto-sec:#cbd5e1;

    --verde:#22c55e;
    --verde-light:#4ade80;

    --rojo:#ef4444;
    --rojo-hover:#dc2626;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(
        135deg,
        #567785 0%,
        #6c6472 100%
    );
}

/* =========================
   CARRITO FLOTANTE
========================= */

.carrito{
    position:fixed;
    top:15px;
    right:15px;

    width:340px;
    height:720px;

    background:var(--fondo);

    border-radius:18px;

    border:1px solid rgba(167,64,231,.35);

    overflow:hidden;

    box-shadow:
        0 15px 45px rgba(0,0,0,.45),
        0 0 25px rgba(167,64,231,.18);
}

/* =========================
   HEADER
========================= */

.carrito-header{
    background:var(--principal);
    color:white;

    padding:16px 18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.carrito-header h2{
    font-size:22px;
    font-weight:700;
}

.btn-cerrar{
    width:34px;
    height:34px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,.15);

    color:white;

    cursor:pointer;

    font-size:18px;
}

.btn-cerrar:hover{
    background:rgba(255,255,255,.25);
}

/* =========================
   BADGE
========================= */

.badge{
    position:absolute;
    top:65px;
    right:15px;

    background:var(--principal);

    color:white;

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;
    font-weight:700;

    box-shadow:0 0 12px rgba(167,64,231,.35);
}

/* =========================
   CONTENIDO
========================= */

.contenido{
    padding:15px;
}

select{
    width:100%;
    height:44px;

    background:#2a3344;

    border:1px solid rgba(167,64,231,.35);

    border-radius:8px;

    color:white;

    padding:0 10px;

    outline:none;
}

/* =========================
   TITULO PRODUCTOS
========================= */

.titulo{
    display:flex;
    justify-content:space-between;

    margin-top:18px;
    margin-bottom:12px;

    color:white;
    font-weight:600;
}

/* =========================
   PRODUCTO
========================= */

.producto{
    background:var(--fondo-card);

    border-left:5px solid var(--principal);

    border-radius:12px;

    padding:12px;

    margin-bottom:12px;
}

.producto h3{
    color:white;
    margin-bottom:10px;
    font-size:18px;
}

.info{
    display:flex;
    justify-content:space-between;

    margin-bottom:8px;
}

.label{
    color:var(--texto-sec);
    font-size:14px;
}

.valor{
    color:white;
}

.precio{
    color:var(--verde-light);
    font-weight:bold;
}

/* =========================
   FECHA
========================= */

.fecha{
    margin-top:12px;

    text-align:center;

    padding:8px;

    border-radius:8px;

    background:rgba(167,64,231,.15);

    border:1px solid rgba(167,64,231,.35);

    color:var(--principal-light);

    font-size:13px;
    font-weight:600;
}

/* =========================
   FOOTER
========================= */

.footer{
    position:absolute;
    bottom:0;
    left:0;

    width:100%;

    background:var(--footer);

    border-top:1px solid rgba(255,255,255,.08);

    padding:15px;
}

/* =========================
   TOTAL
========================= */

.total{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.total-text{
    color:white;
    font-size:22px;
    font-weight:700;
}

.total-precio{
    color:var(--verde);
    font-size:26px;
    font-weight:700;
}

/* =========================
   BOTONES
========================= */

.botones{
    display:flex;
    gap:10px;
}

.btn{
    flex:1;

    height:46px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:15px;
    font-weight:700;

    transition:.2s;
}

.btn-limpiar{
    background:var(--rojo);
    color:white;
}

.btn-limpiar:hover{
    background:var(--rojo-hover);
}

.btn-confirmar{
    background:var(--principal);
    color:white;
}

.btn-confirmar:hover{
    background:var(--principal-hover);
    transform:translateY(-1px);
}

/* =========================
   SCROLL
========================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:var(--principal);
    border-radius:20px;
}

</style>
</head>
<body>

<div class="carrito">

    <div class="carrito-header">
        <h2>🛒 Carrito de Compras</h2>
        <button class="btn-cerrar">✕</button>
    </div>

    <div class="badge">
        1 Producto
    </div>

    <div class="contenido">

        <select>
            <option>Boliviano</option>
            <option>Dólar</option>
        </select>

        <div class="titulo">
            <span>Productos</span>
            <span>Subtotal: BOB 190.00</span>
        </div>

        <div class="producto">

            <h3>PROMO 30 DÍAS</h3>

            <div class="info">
                <span class="label">Precio</span>
                <span class="precio">BOB 190.00</span>
            </div>

            <div class="info">
                <span class="label">Cantidad</span>
                <span class="valor">1</span>
            </div>

            <div class="info">
                <span class="label">Tipo</span>
                <span class="valor">Servicio</span>
            </div>

            <div class="fecha">
                📅 Fecha de vencimiento
            </div>

        </div>

    </div>

    <div class="footer">

        <div class="total">
            <span class="total-text">Total</span>
            <span class="total-precio">BOB 190.00</span>
        </div>

        <div class="botones">

            <button class="btn btn-limpiar">
                Limpiar
            </button>

            <button class="btn btn-confirmar">
                Confirmar Compra
            </button>

        </div>

    </div>

</div>

</body>
</html>

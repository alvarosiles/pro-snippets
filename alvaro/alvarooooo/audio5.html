 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grabación de Llamada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recorder-container {
            background: #1a2f4d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .play-button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .play-icon, .pause-icon, .record-icon {
            width: 0;
            height: 0;
            border-style: solid;
        }

        .play-icon {
            border-width: 10px 0 10px 16px;
            border-color: transparent transparent transparent #1a2f4d;
            margin-left: 3px;
        }

        .pause-icon {
            width: 14px;
            height: 20px;
            border: none;
            background: linear-gradient(to right, #1a2f4d 0%, #1a2f4d 35%, transparent 35%, transparent 65%, #1a2f4d 65%, #1a2f4d 100%);
        }

        .record-icon {
            width: 16px;
            height: 16px;
            background: #ef4444;
            border-radius: 50%;
            border: none;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .waveform-container {
            flex: 1;
            position: relative;
            height: 80px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .waveform {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 0 10px;
        }

        .waveform-bar {
            flex: 1;
            background: linear-gradient(to top, #22c55e, #84cc16, #eab308);
            border-radius: 2px;
            transition: height 0.1s ease;
            min-width: 2px;
            max-width: 4px;
        }

        .time-display {
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            min-width: 40px;
            text-align: center;
        }

        .speed-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .speed-control:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .control-btn.recording {
            background: #ef4444;
            border-color: #ef4444;
        }

        .status-message {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Reemplazado el iframe de YouTube por un elemento audio para el MP3 -->
    <audio 
        style="display: none;" 
        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" 
        autoplay 
        loop
        controls>
    </audio>

    <div class="recorder-container">
        <div class="title">GRABACIÓN DE LLAMADA</div>
        
        <div class="audio-controls">
            <button class="play-button" id="playButton">
                <div class="play-icon" id="playIcon"></div>
            </button>
            
            <span class="time-display" id="currentTime">0:00</span>
            
            <div class="waveform-container">
                <div class="waveform" id="waveform"></div>
            </div>
            
            <span class="time-display" id="duration">0:00</span>
        </div>
        
        <button class="speed-control" id="speedControl">1x</button>
        
        <div class="controls-row">
            <button class="control-btn" id="recordButton">🎤 Grabar</button>
            <button class="control-btn" id="stopButton" disabled>⏹ Detener</button>
            <button class="control-btn" id="downloadButton" disabled>⬇ Descargar</button>
        </div>
        
        <div class="status-message" id="statusMessage">Haz clic en "Grabar" para comenzar</div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let audioUrl;
        let audio;
        let isPlaying = false;
        let isRecording = false;
        let playbackSpeed = 1;
        let animationId;
        let audioContext;
        let analyser;
        let dataArray;

        const playButton = document.getElementById('playButton');
        const playIcon = document.getElementById('playIcon');
        const recordButton = document.getElementById('recordButton');
        const stopButton = document.getElementById('stopButton');
        const downloadButton = document.getElementById('downloadButton');
        const speedControl = document.getElementById('speedControl');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const waveform = document.getElementById('waveform');
        const statusMessage = document.getElementById('statusMessage');

        // Create waveform bars
        for (let i = 0; i < 100; i++) {
            const bar = document.createElement('div');
            bar.className = 'waveform-bar';
            bar.style.height = '10%';
            waveform.appendChild(bar);
        }

        const bars = document.querySelectorAll('.waveform-bar');

        // Record button
        recordButton.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioUrl = URL.createObjectURL(audioBlob);
                    audio = new Audio(audioUrl);
                    
                    audio.addEventListener('loadedmetadata', () => {
                        durationDisplay.textContent = formatTime(audio.duration);
                    });

                    audio.addEventListener('timeupdate', updateProgress);
                    audio.addEventListener('ended', () => {
                        isPlaying = false;
                        playIcon.className = 'play-icon';
                    });

                    downloadButton.disabled = false;
                    statusMessage.textContent = 'Grabación completada. Puedes reproducir o descargar.';
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordButton.classList.add('recording');
                recordButton.textContent = '🔴 Grabando...';
                stopButton.disabled = false;
                statusMessage.textContent = 'Grabando audio...';
                
                // Animate waveform during recording
                animateRecording();
            } catch (err) {
                statusMessage.textContent = 'Error: No se pudo acceder al micrófono';
                console.error('Error accessing microphone:', err);
            }
        });

        // Stop button
        stopButton.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.classList.remove('recording');
                recordButton.textContent = '🎤 Grabar';
                stopButton.disabled = true;
                cancelAnimationFrame(animationId);
            }
        });

        // Play/Pause button
        playButton.addEventListener('click', () => {
            if (!audio) {
                statusMessage.textContent = 'Primero debes grabar audio';
                return;
            }

            if (isPlaying) {
                audio.pause();
                playIcon.className = 'play-icon';
            } else {
                audio.play();
                playIcon.className = 'pause-icon';
            }
            isPlaying = !isPlaying;
        });

        // Speed control
        speedControl.addEventListener('click', () => {
            const speeds = [1, 1.25, 1.5, 2];
            const currentIndex = speeds.indexOf(playbackSpeed);
            playbackSpeed = speeds[(currentIndex + 1) % speeds.length];
            speedControl.textContent = playbackSpeed + 'x';
            if (audio) {
                audio.playbackRate = playbackSpeed;
            }
        });

        // Download button
        downloadButton.addEventListener('click', () => {
            if (audioUrl) {
                const a = document.createElement('a');
                a.href = audioUrl;
                a.download = 'grabacion_' + new Date().getTime() + '.wav';
                a.click();
            }
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            currentTimeDisplay.textContent = formatTime(audio.currentTime);
            
            // Animate waveform based on progress
            const progress = audio.currentTime / audio.duration;
            bars.forEach((bar, index) => {
                const barProgress = index / bars.length;
                if (barProgress < progress) {
                    const height = 20 + Math.random() * 60;
                    bar.style.height = height + '%';
                } else {
                    bar.style.height = '10%';
                }
            });
        }

        function animateRecording() {
            bars.forEach(bar => {
                const height = 20 + Math.random() * 60;
                bar.style.height = height + '%';
            });
            
            if (isRecording) {
                animationId = requestAnimationFrame(animateRecording);
            }
        }

        // Initialize waveform with random heights
        function initializeWaveform() {
            bars.forEach(bar => {
                const height = 20 + Math.random() * 60;
                bar.style.height = height + '%';
            });
        }

        initializeWaveform();
    </script>
</body>
</html>
